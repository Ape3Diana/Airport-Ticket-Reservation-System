# ===============================
# CONFIGURARE SERVER
# ===============================
# Port diferit pentru a putea rula simultan cu microserviciul de Zboruri
server.port=8081

# ===============================
# CONFIGURARE BAZA DE DATE MYSQL
# ===============================
# Conectat la baza de date creata din scriptul tau pentru utilizatori
spring.datasource.url=jdbc:mysql://localhost:3306/db_ps_aeroport_big_project_utilizatori?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURARE JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CONFIGURARE SWAGGER (OPENAPI)
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html